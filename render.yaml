# render.yaml — GlobalPulse Render Deployment Blueprint
# This file auto-configures both services when connected to Render.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ─── Backend (FastAPI + yfinance + XGBoost ML) ─────────────────────────────
  - type: web
    name: globalpulse-backend
    runtime: docker
    dockerfilePath: ./globalpulse-backend/Dockerfile
    dockerContext: ./globalpulse-backend
    plan: free              # 100% Free plan — no credit card required
    region: singapore       # Closest to India
    healthCheckPath: /api/v1/health
    autoDeploy: true

    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "8000"
      - key: LOG_LEVEL
        value: INFO

      # ── Database (Railway PostgreSQL — already running) ─────────────────────
      - key: DATABASE_URL
        sync: false

      # ── Security ────────────────────────────────────────────────────────────
      - key: JWT_SECRET_KEY
        sync: false
      - key: SECRET_KEY
        sync: false

      # ── External API Keys ────────────────────────────────────────────────────
      - key: FINNHUB_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: TRADING_ECONOMICS_API_KEY
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false

      # ── Hugging Face — ML Model Storage ─────────────────────────────────────
      # HF_REPO_ID  : e.g. "your_username/globalpulse-ml-models"
      # HF_TOKEN    : Hugging Face read token (from huggingface.co/settings/tokens)
      - key: HF_REPO_ID
        sync: false
      - key: HF_TOKEN
        sync: false

      # ── CORS ─────────────────────────────────────────────────────────────────
      - key: ALLOWED_ORIGINS
        value: '["https://globalpulse-frontend-axvx.onrender.com","https://globalpulse-frontend-axvv.onrender.com","https://globalpulse-frontend.onrender.com","http://localhost:5173","http://localhost:5174","http://127.0.0.1:5173","http://127.0.0.1:5174"]'
      - key: ALLOWED_HOSTS
        value: '["*"]'

  # ─── Frontend (React + Vite + Nginx) ───────────────────────────────────────
  - type: web
    name: globalpulse-frontend
    runtime: docker
    dockerfilePath: ./Frontend/Dockerfile
    dockerContext: ./Frontend
    plan: free
    region: singapore
    autoDeploy: true

    envVars:
      - key: VITE_API_URL
        value: https://globalpulse-backend-i6oa.onrender.com
      - key: VITE_API_BASE_URL
        value: https://globalpulse-backend-i6oa.onrender.com
